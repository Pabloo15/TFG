security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # USUARIO MAESTRO FIJO (EL JEFE)
        admin_provider:
            memory:
                users:
                    # Usuario: Admin | Password: Admin
                    Admin: { password: '$2y$13$j3E0kC.v6N1HkO5M0qVTe.XvHl.E0XGk9H7N0Z6l8f9yM2R5p6S1.', roles: ['ROLE_ADMIN'] }
        
        # USUARIOS DE LA BASE DE DATOS (LOS SOCIOS)
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: email

        # UNIMOS AMBOS PROVIDERS
        all_users:
            chain:
                providers: [admin_provider, app_user_provider]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: all_users
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # SOLO EL ADMIN ENTRA AQUÍ
        - { path: ^/usuario, roles: ROLE_ADMIN }
        - { path: ^/clase/new, roles: ROLE_ADMIN }
        - { path: ^/clase/\d+/edit, roles: ROLE_ADMIN }
        # EL SOCIO SOLO VE LO DEMÁS
        - { path: ^/, roles: ROLE_USER }
