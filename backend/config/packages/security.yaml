security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'plaintext'

    providers:
        # Solo usamos la base de datos para evitar conflictos
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/new, roles: PUBLIC_ACCESS }
        
        # CORRECCIÓN AQUÍ: Permitimos el acceso público a la creación de usuarios ANTES de bloquear el resto de la sección
        - { path: ^/usuario/new, roles: PUBLIC_ACCESS }
        
        - { path: ^/usuario, roles: ROLE_ADMIN }
        - { path: ^/clase/new, roles: ROLE_ADMIN }
        - { path: ^/clase/\d+/edit, roles: ROLE_ADMIN }
        - { path: ^/seleccionar-centro, roles: ROLE_USER }
        - { path: ^/clase, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }